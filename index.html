<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Heartbeat</title>
  <style>
    :root {
      --bg: #000;
      --heart: #7dd3fc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      overflow: hidden;
      font-family: "Segoe UI", system-ui, sans-serif;
      touch-action: none;
    }

    body {
      display: grid;
      place-items: center;
    }

    canvas {
      display: block;
      width: min(100vw, 640px);
      height: auto;
      max-height: 100vh;
      background: var(--bg);
    }

    .hint {
      position: fixed;
      inset: auto 1rem 1.25rem;
      text-align: center;
      color: rgba(255, 255, 255, 0.45);
      font-size: 0.8rem;
      line-height: 1.4;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <canvas id="heart" width="640" height="480" aria-label="Trái tim đập"></canvas>
  <p class="hint">Đang tải…</p>

  <script>
    const CANVAS_WIDTH = 640;
    const CANVAS_HEIGHT = 480;
    const CX = CANVAS_WIDTH / 2;
    const CY = CANVAS_HEIGHT / 2;
    const IMAGE_ENLARGE = 11;
    const HEART_COLOR = "#7dd3fc";
    const FRAME_DELAY_MS = 160;

    // Phone browsers struggle with the full particle count — scale down.
    const isMobile =
      matchMedia("(max-width: 820px), (pointer: coarse)").matches ||
      /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

    const QUALITY = isMobile
      ? { frames: 12, outline: 900, center: 1600, edgeCopies: 2, haloScale: 0.35 }
      : { frames: 20, outline: 2000, center: 4000, edgeCopies: 3, haloScale: 1 };

    const canvas = document.getElementById("heart");
    const ctx = canvas.getContext("2d", { alpha: false });
    const hint = document.querySelector(".hint");

    const key = (x, y) => `${x | 0},${y | 0}`;

    function heartFunction(t, shrinkRatio = IMAGE_ENLARGE) {
      let x = 16 * Math.sin(t) ** 3;
      let y = -(
        13 * Math.cos(t) -
        5 * Math.cos(2 * t) -
        2 * Math.cos(3 * t) -
        Math.cos(4 * t)
      );
      x = x * shrinkRatio + CX;
      y = y * shrinkRatio + CY;
      return [x | 0, y | 0];
    }

    function scatterInside(x, y, beta = 0.15) {
      const ratioX = -beta * Math.log(Math.random());
      const ratioY = -beta * Math.log(Math.random());
      return [x - ratioX * (x - CX), y - ratioY * (y - CY)];
    }

    function shrink(x, y, ratio) {
      const dist = ((x - CX) ** 2 + (y - CY) ** 2) ** 0.6 || Number.EPSILON;
      const force = -1 / dist;
      return [x - ratio * force * (x - CX), y - ratio * force * (y - CY)];
    }

    function curve(p) {
      return (2 * (2 * Math.sin(4 * p))) / (2 * Math.PI);
    }

    function pulseRatio(frame) {
      return 10 * curve((frame / 10) * Math.PI);
    }

    function calcPosition(x, y, ratio) {
      const dist = ((x - CX) ** 2 + (y - CY) ** 2) ** 0.52 || Number.EPSILON;
      const force = 1 / dist;
      const dx = ratio * force * (x - CX) + (Math.random() < 0.5 ? -1 : 1);
      const dy = ratio * force * (y - CY) + (Math.random() < 0.5 ? -1 : 1);
      return [x - dx, y - dy];
    }

    function randInt(lo, hi) {
      return lo + ((Math.random() * (hi - lo + 1)) | 0);
    }

    class Heart {
      constructor() {
        this.points = new Map();
        this.edgePoints = new Map();
        this.centerPoints = new Map();
        this.allPoints = [];
        this.generateFrame = QUALITY.frames;
        this.build();
      }

      build() {
        for (let i = 0; i < QUALITY.outline; i++) {
          const [x, y] = heartFunction(Math.random() * Math.PI * 2);
          this.points.set(key(x, y), [x, y]);
        }

        for (const [px, py] of this.points.values()) {
          for (let i = 0; i < QUALITY.edgeCopies; i++) {
            const [x, y] = scatterInside(px, py, 0.05);
            this.edgePoints.set(key(x, y), [x, y]);
          }
        }

        const outline = [...this.points.values()];
        for (let i = 0; i < QUALITY.center; i++) {
          const [bx, by] = outline[(Math.random() * outline.length) | 0];
          const [x, y] = scatterInside(bx, by, 0.17);
          this.centerPoints.set(key(x, y), [x, y]);
        }
      }

      appendHalo(frame, out) {
        const pulse = curve((frame / 10) * Math.PI);
        const haloRadius = (4 + 6 * (1 + pulse)) | 0;
        const haloNumber =
          ((3000 + 4000 * Math.abs(pulse ** 2)) * QUALITY.haloScale) | 0;
        const seen = new Set();

        for (let i = 0; i < haloNumber; i++) {
          let [x, y] = heartFunction(Math.random() * Math.PI * 2, 11.6);
          [x, y] = shrink(x, y, haloRadius);
          const k = key(x, y);
          if (seen.has(k)) continue;
          seen.add(k);
          x += randInt(-14, 14);
          y += randInt(-14, 14);
          out.push(x, y, [1, 2, 2][(Math.random() * 3) | 0]);
        }
      }

      appendLayer(points, ratio, sizeLo, sizeHi, out) {
        for (const [x, y] of points.values()) {
          const [nx, ny] = calcPosition(x, y, ratio);
          out.push(nx, ny, randInt(sizeLo, sizeHi));
        }
      }

      calc(frame) {
        const ratio = pulseRatio(frame);
        const out = [];
        this.appendHalo(frame, out);
        this.appendLayer(this.points, ratio, 1, 3, out);
        this.appendLayer(this.edgePoints, ratio, 1, 2, out);
        this.appendLayer(this.centerPoints, ratio, 1, 2, out);
        this.allPoints[frame] = out;
      }

      async precompute(onProgress) {
        for (let frame = 0; frame < this.generateFrame; frame++) {
          this.calc(frame);
          onProgress?.(frame + 1, this.generateFrame);
          // Yield so mobile UI stays responsive / doesn't get killed.
          await new Promise((r) => setTimeout(r, 0));
        }
      }

      render(frame) {
        const pts = this.allPoints[frame % this.generateFrame];
        ctx.fillStyle = HEART_COLOR;
        for (let i = 0; i < pts.length; i += 3) {
          ctx.fillRect(pts[i], pts[i + 1], pts[i + 2], pts[i + 2]);
        }
      }
    }

    async function start() {
      try {
        hint.textContent = "Đang tạo trái tim…";
        await new Promise((r) => requestAnimationFrame(r));

        const heart = new Heart();
        await heart.precompute((done, total) => {
          hint.textContent = `Đang tạo trái tim… ${done}/${total}`;
        });

        hint.remove();
        let frame = 0;

        function tick() {
          ctx.fillStyle = "#000";
          ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
          heart.render(frame++);
          setTimeout(tick, FRAME_DELAY_MS);
        }

        tick();
      } catch (err) {
        hint.textContent = "Lỗi tải animation. Thử mở lại hoặc dùng Wi‑Fi.";
        console.error(err);
      }
    }

    start();
  </script>
</body>
</html>
